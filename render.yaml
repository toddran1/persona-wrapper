# yaml-language-server: $schema=https://render.com/schema/render.yaml.json

# Hosted development and production environments. Local development continues
# to use the existing local .env files and Docker Postgres configuration.
# Production uses distinct Render services, database credentials, Better Auth
# secret, and a separate R2 key prefix from development.
services:
  - type: web
    runtime: node
    name: for-the-baddiez-api-dev
    region: ohio
    plan: starter
    autoDeployTrigger: commit
    # TypeScript's declarations are build-time dev dependencies. Keep the
    # service's production mode scoped to migration and runtime commands.
    buildCommand: npm ci --include=dev && npm run build -w @persona/shared && npm run build -w @persona/api
    preDeployCommand: NODE_ENV=production npm run db:migrate -w @persona/api
    startCommand: NODE_ENV=production npm run start -w @persona/api
    healthCheckPath: /health
    maxShutdownDelaySeconds: 30
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - package.json
        - package-lock.json
        - render.yaml
    envVars:
      - key: NODE_VERSION
        value: 22.13.0
      - key: APP_TEST_MODE
        value: "false"
      # Render terminates HTTPS one proxy hop in front of the Node service.
      - key: API_TRUST_PROXY_HOPS
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: for-the-baddiez-db-dev
          property: connectionString

      # These URLs depend on the stable service names in this file.
      # Update all four if Render assigns a different subdomain.
      - key: WEB_APP_URL
        value: https://for-the-baddiez-web-dev.onrender.com
      - key: CORS_ALLOWED_ORIGINS
        value: https://for-the-baddiez-web-dev.onrender.com
      - key: OBSERVABILITY_DASHBOARD_TOKEN
        sync: false
      # Copy the endpoint and Authorization header from the Grafana Cloud
      # OpenTelemetry connection. Both stay disabled until configured.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false
      - key: OTEL_EXPORTER_OTLP_PROTOCOL
        value: http/protobuf
      - key: OTEL_SERVICE_NAME
        value: for-the-baddiez-api-dev
      - key: OTEL_RESOURCE_ATTRIBUTES
        value: deployment.environment.name=development,service.namespace=for-the-baddiez
      - key: OTEL_TRACES_SAMPLER
        value: parentbased_traceidratio
      - key: OTEL_TRACES_SAMPLER_ARG
        value: "0.25"
      - key: BETTER_AUTH_URL
        value: https://for-the-baddiez-api-dev.onrender.com
      - key: BETTER_AUTH_SECRET
        generateValue: true
      - key: GMAIL_SMTP_USER
        value: forthebaddiez.ai@gmail.com
      - key: GMAIL_SMTP_APP_PASSWORD
        sync: false

      - key: AUTH_REQUIRED
        value: "true"
      - key: APP_ADMIN_EMAILS
        value: "todd@yahoo.com,todd_ran222@yahoo.com,toddran1@gmail.com"
      - key: AUTH_REQUIRE_OWNED_MEDIA_ACCESS
        value: "true"
      - key: AUTH_REFRESH_TOKEN_TTL_DAYS
        value: "30"
      - key: TERMS_POLICY_VERSION
        value: "2026-08-14.2"
      - key: PRIVACY_POLICY_VERSION
        value: "2026-08-14.3"
      - key: AUTH_ACCOUNT_DELETION_GRACE_DAYS
        value: "30"
      - key: AUTH_SIGNUP_DEVICE_LIMIT
        value: "5"
      - key: AUTH_SIGNUP_IP_LIMIT
        value: "100"
      - key: AUTH_SIGNUP_WINDOW_MS
        value: "2592000000"
      - key: CHAT_RATE_LIMIT_REQUESTS
        value: "30"
      - key: CHAT_RATE_LIMIT_WINDOW_MS
        value: "60000"
      - key: CHAT_DEVICE_RATE_LIMIT_REQUESTS
        value: "45"
      - key: CHAT_IP_RATE_LIMIT_REQUESTS
        value: "120"
      - key: CUSTOMER_USAGE_ENFORCEMENT_ENABLED
        value: "true"
      - key: BILLING_ENABLED
        value: "false"
      - key: BILLING_PROVIDER
        value: revenuecat
      - key: REVENUECAT_OFFERING_ID
        value: default
      - key: REVENUECAT_WEBHOOK_AUTHORIZATION
        sync: false
      - key: REVENUECAT_ALLOWED_ENVIRONMENTS
        value: SANDBOX
      - key: REVENUECAT_ALLOWED_APP_IDS
        sync: false
      - key: CUSTOMER_USAGE_AUDIO_COST_PER_MINUTE_USD
        value: "0.021"
      - key: CUSTOMER_USAGE_IMAGE_INPUT_COST_USD
        value: "0.01"
      - key: CUSTOMER_USAGE_STYLE_TRANSFER_COST_PER_CALL_USD
        value: "0.01"

      - key: OPENAI_API_KEY
        sync: false
      - key: GOOGLE_GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.5-flash-lite
      - key: GEMINI_NATIVE_YOUTUBE_REQUEST_TIMEOUT_MS
        value: "120000"
      - key: GEMINI_VIDEO_ANALYSIS_ENABLED
        value: "true"
      - key: GEMINI_VIDEO_ANALYSIS_CACHE_TTL_MS
        value: "604800000"
      - key: GEMINI_VIDEO_ANALYSIS_AUTO_MAX_DURATION_SECONDS
        value: "3600"
      - key: GEMINI_VIDEO_ANALYSIS_EXPLICIT_MAX_DURATION_SECONDS
